# Target Companies & ATS Boards Configuration
# Configured specifically for high-compensation SDE 1 / SDE 2 India roles (₹33L - ₹65L+ CTC)
jobfinder:
  target-ctc-lpa: 33
  max-age-days: 30
  min-score: 59

  # ====================================================================
  # SMARTRECRUITERS BOARDS (Direct Official JSON API)
  # ====================================================================
  smartrecruiters:
    - company: "PhonePe"
      identifier: "PHONEPELIMITED"
      careers-url: "https://careers.smartrecruiters.com/PHONEPELIMITED"
    - company: "Visa"
      identifier: "Visa"
      careers-url: "https://careers.smartrecruiters.com/Visa"
    - company: "Freshworks"
      identifier: "Freshworks"
      careers-url: "https://careers.smartrecruiters.com/Freshworks"

  # ====================================================================
  # GREENHOUSE BOARDS (Direct Verified JSON API)
  # ====================================================================
  greenhouse:
    - company: "Stripe"
      token: "stripe"
      careers-url: "https://stripe.com/jobs"
    - company: "Databricks"
      token: "databricks"
      careers-url: "https://www.databricks.com/company/careers"
    - company: "MongoDB"
      token: "mongodb"
      careers-url: "https://www.mongodb.com/company/careers"
    - company: "Cloudflare"
      token: "cloudflare"
      careers-url: "https://www.cloudflare.com/careers"
    - company: "Elastic"
      token: "elastic"
      careers-url: "https://www.elastic.co/about/careers"
    - company: "Twilio"
